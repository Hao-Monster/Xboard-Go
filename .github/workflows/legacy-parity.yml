name: Legacy parity

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: legacy-parity-bingo-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.target.outputs.authorized }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: target
        name: Authorize an exact trusted-main commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/authorize-legacy-parity.mjs

  legacy-parity:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Linux, X64, xboard-go-legacy-parity]
    timeout-minutes: 45
    environment: development
    defaults:
      run:
        working-directory: ${{ github.workspace }}/candidate-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      COREPACK_ENABLE_NETWORK: "0"
      GOTOOLCHAIN: local
      # The isolated server cannot reach proxy.golang.org reliably. Downloads
      # still use go.sum and the standard checksum database for verification.
      GOPROXY: https://goproxy.cn,direct
      http_proxy: http://100.120.174.30:7890
      https_proxy: http://100.120.174.30:7890
      all_proxy: socks5h://100.120.174.30:7890
      no_proxy: localhost,127.0.0.1,::1,100.64.0.0/10,github.com,api.github.com,raw.githubusercontent.com,githubusercontent.com,registry.npmjs.org,npmjs.org,freedom.openal.uk,.openal.uk
    steps:
      - name: Download the authorized source archive
        working-directory: ${{ github.workspace }}
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_DIRECTORY: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DIRECTORY" =~ ^candidate-[0-9]+-[0-9]+$ ]]
          # A fresh directory prevents files from an earlier job entering the build.
          # Codeload is GitHub's archive host; no Git credentials or proxy are needed.
          mkdir -m 700 "$CANDIDATE_DIRECTORY"
          archive="$(mktemp "$RUNNER_TEMP/xboard-source.XXXXXX.tar.gz")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --noproxy codeload.github.com --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-delay 3 \
            "https://codeload.github.com/Hao-Monster/Xboard-Go/tar.gz/$TARGET_SHA" \
            --output "$archive"
          tar --extract --gzip --file "$archive" --strip-components=1 \
            --no-same-owner --directory "$CANDIDATE_DIRECTORY"
          test -f "$CANDIDATE_DIRECTORY/go.mod"
          test -f "$CANDIDATE_DIRECTORY/web/pnpm-lock.yaml"
      - name: Configure the pinned server Node toolchain
        run: |
          echo '/opt/xboard-go-ci-tools/node-v24.20.0-linux-x64/bin' >> "$GITHUB_PATH"
      - name: Configure Go from the authorized source
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ github.workspace }}/candidate-${{ github.run_id }}-${{ github.run_attempt }}/go.mod
          cache: false
      - name: Install build dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Build the exact release
        env:
          XBOARD_GO_IMAGE: xboard-go:legacy-parity-${{ needs.authorize.outputs.sha }}
          XBOARD_GO_REVISION: ${{ needs.authorize.outputs.sha }}
          COMPOSE_PROJECT_NAME: xboard-go-legacy-parity-${{ github.run_id }}
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          install -d -m 700 .local/image-context
          CGO_ENABLED=0 GOOS=linux go build -buildvcs=false -trimpath \
            -ldflags="-s -w -buildid= -X main.buildRevision=$TARGET_SHA" \
            -o .local/image-context/xboard ./cmd/xboard
          pnpm --dir web build
          cp -a web/dist .local/image-context/web-dist
          python3 deploy/fetch-node-bundle.py .local/image-context/node-releases
          cat > .local/Dockerfile.legacy-parity <<'DOCKERFILE'
          FROM xboard-go:ci-base-3784c0a
          ARG APP_REVISION
          COPY --chown=65532:65532 xboard /xboard
          COPY --chown=65532:65532 web-dist /srv/xboard/web
          COPY --chown=65532:65532 node-releases /usr/share/xboard/node-releases
          ENV XBOARD_NODE_RELEASE=v1.14.4 XBOARD_NODE_RELEASE_ROOT=/usr/share/xboard/node-releases
          LABEL org.opencontainers.image.revision="${APP_REVISION}"
          DOCKERFILE
          docker build \
            --file .local/Dockerfile.legacy-parity \
            --build-arg "APP_REVISION=$TARGET_SHA" \
            --tag "$XBOARD_GO_IMAGE" \
            .local/image-context
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$XBOARD_GO_IMAGE")" = "$TARGET_SHA"
      - name: Deploy to development server (freedom) with failure data preservation
        if: success()
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          DEPLOY_KEY: ${{ secrets.BINGO_DEV_SSH_KEY }}
          XBOARD_GO_IMAGE: xboard-go:legacy-parity-${{ needs.authorize.outputs.sha }}
        run: |
          echo "Starting automated deployment for candidate: ${TARGET_SHA}"
          # 1. Configure SSH client
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true

          # 2. Tag and stream the candidate image directly to bingo's system docker
          docker tag "$XBOARD_GO_IMAGE" "xboard-go:${TARGET_SHA}"
          docker save "xboard-go:${TARGET_SHA}" | gzip -1 | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new bingo@127.0.0.1 "gunzip | docker load"

          # 3. Deploy remotely on bingo-dev as user bingo
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new bingo@127.0.0.1 "REVISION=${TARGET_SHA} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/bingo/apps/xboard-go-freedom
          exec 9>.deployment.lock
          flock -x 9
          if [[ -e .deployment-failed || -L .deployment-failed ]]; then
            echo 'Previous deployment needs explicit recovery; inspect .deployment-failed before retrying.' >&2
            exit 1
          fi
          if [[ -f compose.observability.yaml ]]; then
            test ! -L compose.observability.yaml
            export COMPOSE_FILE=compose.yaml:compose.observability.yaml
          fi
          previous="$(docker inspect xboard-go-freedom-app-1 --format '{{.Config.Image}}' 2>/dev/null || echo 'xboard-go:38a6d3f0')"
          echo "Current running image: ${previous}"
          echo "Deploying target image: xboard-go:${REVISION}"

          backup_suffix="pre-${REVISION}-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -p compose.yaml "compose.yaml.${backup_suffix}"
          cp -p .env ".env.${backup_suffix}"
          # This online snapshot is for explicit recovery, not lossless automatic rollback.
          database_backup="/var/lib/xboard-backups/${backup_suffix}.xbbackup"
          docker compose exec -T app /xboard backup create --attachment-root "" --output "$database_backup" </dev/null >/dev/null

          activation_started=0
          preserve_failed_deployment() {
            trap - ERR INT TERM HUP
            echo '[-] Deployment failed; current database/WAL, configuration and backup retained. Explicit recovery required.' >&2
            if ! printf 'phase=failed\n' >> .deployment-failed; then
              echo '[-] Could not update the deployment failure marker.' >&2
            fi
            if [[ "$activation_started" -eq 1 ]]; then
              if ! docker compose stop app; then
                echo '[-] Failed to stop the candidate; inspect the running application immediately.' >&2
              fi
            fi
            exit 1
          }
          trap preserve_failed_deployment ERR INT TERM HUP
          # Persist before mutation so an interrupted run cannot be silently retried.
          printf 'revision=%s\nprevious=%s\nbackup=%s\nphase=prepared\n' "$REVISION" "$previous" "$database_backup" > .deployment-failed
          chmod 600 .deployment-failed

          sed -i "s/^XBOARD_GO_REVISION=.*/XBOARD_GO_REVISION=${REVISION}/" .env
          # Existing release volume is retained; serve the verified bundle from this image.
          sed -i 's#^\([[:space:]]*XBOARD_NODE_RELEASE_ROOT:\).*#\1 /usr/share/xboard/node-releases#' compose.yaml
          activation_started=1
          docker compose up -d --no-build app

          echo "Waiting for container healthcheck..."
          healthy=0
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' xboard-go-freedom-app-1 2>/dev/null || true)"
            echo "Check $i/30: health status is '$status'"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            elif [ "$status" = "unhealthy" ]; then
              echo "[-] Container reported unhealthy!"
              preserve_failed_deployment
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "[-] Container health check timed out!"
            preserve_failed_deployment
          fi

          echo "Testing loopback endpoint 127.0.0.1:18082/healthz..."
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 http://127.0.0.1:18082/healthz >/dev/null
          test "$(docker inspect xboard-go-freedom-app-1 --format '{{.Config.Image}}')" = "xboard-go:${REVISION}"

          # Public checks share the same failure boundary; they must not bypass
          # stop-and-preserve after the candidate has already accepted requests.
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 3 https://freedom.openal.uk/healthz >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 3 https://freedom.openal.uk/ >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://freedom.openal.uk/api/v2/node/releases/v1.14.4 >/dev/null
          rm .deployment-failed
          echo "Deployment successful for revision: ${REVISION}"
          trap - ERR INT TERM HUP
          REMOTE

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new bingo@127.0.0.1 "python3 - development-host --mode cleanup" < deploy/retain-online-only.py
          rm -f ~/.ssh/deploy_key
      - name: Remove temporary deployment key and converge runner workspace
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          CANDIDATE_DIRECTORY: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          XBOARD_GO_IMAGE: xboard-go:legacy-parity-${{ needs.authorize.outputs.sha }}
        run: |
          rm -f ~/.ssh/deploy_key
          docker image rm "$XBOARD_GO_IMAGE" "xboard-go:${TARGET_SHA}" 2>/dev/null || true
          if [[ -f "$CANDIDATE_DIRECTORY/deploy/retain-online-only.py" ]]; then
            python3 "$CANDIDATE_DIRECTORY/deploy/retain-online-only.py" runner-host --mode cleanup --workspace "$GITHUB_WORKSPACE" || true
          fi
          chmod -R u+rwX "$CANDIDATE_DIRECTORY" 2>/dev/null || true
          rm -rf "$CANDIDATE_DIRECTORY"

  logging-validate:
    needs: authorize
    permissions:
      contents: read
      actions: read
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Verify private logging configuration and recovery
        run: |
          python3 -m unittest discover -s deploy/observability -p '*test*.py'
          python3 -m unittest discover -s deploy -p 'logging_test.py'
          python3 deploy/observability/smoke.py
      - name: Package the tested collector image
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          mkdir collector-artifact
          docker tag xboard-log-collector:local "xboard-log-collector:$SOURCE_SHA"
          docker save "xboard-log-collector:$SOURCE_SHA" | gzip > collector-artifact/collector.tar.gz
          python3 deploy/package-log-collector.py collector-artifact "$SOURCE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-log-collector
          path: collector-artifact/
          retention-days: 3
          compression-level: 0
      - name: Verify artifact HTTPS download round trip
        env:
          GH_TOKEN: ${{ github.token }}
          LOGGING_IMAGE_DIRECTORY: collector-roundtrip
          LOGGING_VERIFY_RESUME: "1"
        run: python3 deploy/download-log-collector.py

  logging-deploy:
    needs: [authorize, logging-validate]
    permissions:
      contents: read
      actions: read
    concurrency:
      group: production-internal-test-deployment
      cancel-in-progress: false
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Linux, X64, xboard-go-legacy-parity]
    timeout-minutes: 45
    environment: production-internal-test
    env:
      http_proxy: http://100.120.174.30:7890
      https_proxy: http://100.120.174.30:7890
      no_proxy: localhost,127.0.0.1,::1,100.64.0.0/10
    steps:
      - name: Download exact reviewed source
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate="$GITHUB_WORKSPACE/logging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$candidate"
          archive="$(mktemp "$RUNNER_TEMP/logging-source.XXXXXX.tar.gz")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --noproxy codeload.github.com --connect-timeout 10 --max-time 120 --retry 2 \
            "https://codeload.github.com/Hao-Monster/Xboard-Go/tar.gz/$TARGET_SHA" --output "$archive"
          tar -xzf "$archive" --strip-components=1 --no-same-owner -C "$candidate"
          echo "LOGGING_CANDIDATE=$candidate" >> "$GITHUB_ENV"
      - name: Download and verify the current-run collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
          LOGGING_IMAGE_DIRECTORY: ${{ runner.temp }}/log-collector-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd "$LOGGING_CANDIDATE"
          python3 deploy/download-log-collector.py
      - name: Deploy scoped collectors and private log center
        env:
          LOGGING_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          LOGGING_IMAGE_DIRECTORY: ${{ runner.temp }}/log-collector-${{ github.run_id }}-${{ github.run_attempt }}
          BINGO_DEV_SSH_KEY: ${{ secrets.BINGO_DEV_SSH_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          cd "$LOGGING_CANDIDATE"
          python3 deploy/logging-runner.py
      - name: Remove temporary logging workspace and artifact cache
        if: always()
        run: |
          rm -rf "${LOGGING_CANDIDATE:-}" "${{ runner.temp }}/log-collector-${{ github.run_id }}-${{ github.run_attempt }}"
