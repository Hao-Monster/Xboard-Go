name: Legacy parity

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: legacy-parity-bingo-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.target.outputs.authorized }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: target
        name: Authorize an exact trusted-main commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/authorize-legacy-parity.mjs

  legacy-parity:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Linux, X64, xboard-go-legacy-parity]
    timeout-minutes: 45
    environment: development
    defaults:
      run:
        working-directory: ${{ github.workspace }}/candidate-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      COREPACK_ENABLE_NETWORK: "0"
      GOTOOLCHAIN: local
      # The isolated server cannot reach proxy.golang.org reliably. Downloads
      # still use go.sum and the standard checksum database for verification.
      GOPROXY: https://goproxy.cn,direct
      http_proxy: http://100.120.174.30:7890
      https_proxy: http://100.120.174.30:7890
      all_proxy: socks5h://100.120.174.30:7890
      no_proxy: localhost,127.0.0.1,::1,100.64.0.0/10,github.com,api.github.com,raw.githubusercontent.com,githubusercontent.com,registry.npmjs.org,npmjs.org,freedom.openal.uk,.openal.uk
    steps:
      - name: Download the authorized source archive
        working-directory: ${{ github.workspace }}
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_DIRECTORY: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DIRECTORY" =~ ^candidate-[0-9]+-[0-9]+$ ]]
          # A fresh directory prevents files from an earlier job entering the build.
          # Codeload is GitHub's archive host; no Git credentials or proxy are needed.
          mkdir -m 700 "$CANDIDATE_DIRECTORY"
          archive="$(mktemp "$RUNNER_TEMP/xboard-source.XXXXXX.tar.gz")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --noproxy codeload.github.com --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-delay 3 \
            "https://codeload.github.com/Hao-Monster/Xboard-Go/tar.gz/$TARGET_SHA" \
            --output "$archive"
          tar --extract --gzip --file "$archive" --strip-components=1 \
            --no-same-owner --directory "$CANDIDATE_DIRECTORY"
          test -f "$CANDIDATE_DIRECTORY/go.mod"
          test -f "$CANDIDATE_DIRECTORY/web/pnpm-lock.yaml"
      - name: Configure the pinned server toolchain
        run: |
          echo '/opt/xboard-go-ci-tools/node-v24.20.0-linux-x64/bin' >> "$GITHUB_PATH"
          echo '/opt/xboard-go-ci-tools/go1.26.8/bin' >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Build the exact release
        env:
          XBOARD_GO_IMAGE: xboard-go:legacy-parity-${{ needs.authorize.outputs.sha }}
          XBOARD_GO_REVISION: ${{ needs.authorize.outputs.sha }}
          COMPOSE_PROJECT_NAME: xboard-go-legacy-parity-${{ github.run_id }}
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          install -d -m 700 .local/image-context
          CGO_ENABLED=0 GOOS=linux go build -buildvcs=false -trimpath \
            -ldflags="-s -w -buildid= -X main.buildRevision=$TARGET_SHA" \
            -o .local/image-context/xboard ./cmd/xboard
          pnpm --dir web build
          cp -a web/dist .local/image-context/web-dist
          cat > .local/Dockerfile.legacy-parity <<'DOCKERFILE'
          FROM xboard-go:ci-base-3784c0a
          ARG APP_REVISION
          COPY --chown=65532:65532 xboard /xboard
          COPY --chown=65532:65532 web-dist /srv/xboard/web
          LABEL org.opencontainers.image.revision="${APP_REVISION}"
          DOCKERFILE
          docker build \
            --file .local/Dockerfile.legacy-parity \
            --build-arg "APP_REVISION=$TARGET_SHA" \
            --tag "$XBOARD_GO_IMAGE" \
            .local/image-context
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$XBOARD_GO_IMAGE")" = "$TARGET_SHA"
      - name: Deploy to development server (freedom) with atomic rollback
        if: success()
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          DEPLOY_KEY: ${{ secrets.BINGO_DEV_SSH_KEY }}
          XBOARD_GO_IMAGE: xboard-go:legacy-parity-${{ needs.authorize.outputs.sha }}
        run: |
          echo "Starting automated deployment for candidate: ${TARGET_SHA}"
          # 1. Configure SSH client
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true

          # 2. Tag and stream the candidate image directly to bingo's system docker
          docker tag "$XBOARD_GO_IMAGE" "xboard-go:${TARGET_SHA}"
          docker save "xboard-go:${TARGET_SHA}" | gzip -1 | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new bingo@127.0.0.1 "gunzip | docker load"

          # 3. Deploy remotely on bingo-dev as user bingo
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new bingo@127.0.0.1 "REVISION=${TARGET_SHA} bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/bingo/apps/xboard-go-freedom
          previous="$(docker inspect xboard-go-freedom-app-1 --format '{{.Config.Image}}' 2>/dev/null || echo 'xboard-go:38a6d3f0')"
          echo "Current running image: ${previous}"
          echo "Deploying target image: xboard-go:${REVISION}"

          backup_suffix="pre-${REVISION}-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -p compose.yaml "compose.yaml.${backup_suffix}"
          cp -p .env ".env.${backup_suffix}"
          # SQLite schema upgrades require a database rollback point, not only an image.
          database_backup="/var/lib/xboard-backups/${backup_suffix}.xbbackup"
          docker compose exec -T app /xboard backup create --attachment-root "" --output "$database_backup" </dev/null >/dev/null

          rollback() {
            trap - ERR
            echo "[-] Deployment failed! Rolling back to ${previous}..."
            docker compose stop app
            cp -p "compose.yaml.${backup_suffix}" compose.yaml
            cp -p ".env.${backup_suffix}" .env
            restored_database="/var/lib/xboard/rollback-${backup_suffix}.db"
            docker compose run --rm --no-deps app backup restore --input "$database_backup" --output "$restored_database" </dev/null >/dev/null
            # Keep the failed candidate database intact for diagnosis.
            sed -i "s#XBOARD_DATABASE_DSN: .*#XBOARD_DATABASE_DSN: file:${restored_database}#" compose.yaml
            docker compose up -d --no-build app
            exit 1
          }
          trap 'rollback' ERR

          sed -i "s/^XBOARD_GO_REVISION=.*/XBOARD_GO_REVISION=${REVISION}/" .env
          docker compose up -d --no-build app

          echo "Waiting for container healthcheck..."
          healthy=0
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' xboard-go-freedom-app-1 2>/dev/null || true)"
            echo "Check $i/30: health status is '$status'"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            elif [ "$status" = "unhealthy" ]; then
              echo "[-] Container reported unhealthy!"
              rollback
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "[-] Container health check timed out!"
            rollback
          fi

          echo "Testing loopback endpoint 127.0.0.1:18082/healthz..."
          curl --fail --silent --show-error http://127.0.0.1:18082/healthz >/dev/null
          test "$(docker inspect xboard-go-freedom-app-1 --format '{{.Config.Image}}')" = "xboard-go:${REVISION}"

          echo "Deployment successful for revision: ${REVISION}"
          trap - ERR
          REMOTE

          rm -f ~/.ssh/deploy_key
      - name: Verify public HTTPS endpoint
        if: success()
        run: |
          echo "Verifying public HTTPS endpoint..."
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://freedom.openal.uk/healthz >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://freedom.openal.uk/ >/dev/null
          echo "Public HTTPS smoke verification SUCCESS!"
      - name: Remove temporary deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
