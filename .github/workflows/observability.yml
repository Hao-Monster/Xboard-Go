name: Private observability
on:
  push:
    branches: [codex/ci-001-tiered-gates]
    paths:
      - 'deploy/logging-*'
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xboard-private-observability
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configuration and deployment boundary tests
        run: |
          python3 -m unittest discover -s deploy/observability -p '*test*.py'
          python3 -m unittest discover -s deploy -p 'logging_test.py'
      - name: Real isolated log ingestion and recovery
        run: python3 deploy/observability/smoke.py
  deploy:
    needs: validate
    concurrency:
      group: production-internal-test-deployment
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, xboard-go-legacy-parity]
    timeout-minutes: 25
    environment: production-internal-test
    steps:
      - name: Download exact reviewed source
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate="$GITHUB_WORKSPACE/logging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$candidate"
          archive="$(mktemp "$RUNNER_TEMP/logging-source.XXXXXX.tar.gz")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --noproxy codeload.github.com --connect-timeout 10 --max-time 120 --retry 2 \
            "https://codeload.github.com/Hao-Monster/Xboard-Go/tar.gz/$TARGET_SHA" --output "$archive"
          tar -xzf "$archive" --strip-components=1 --no-same-owner -C "$candidate"
          echo "LOGGING_CANDIDATE=$candidate" >> "$GITHUB_ENV"
      - name: Deploy scoped collectors and private log center
        env:
          BINGO_DEV_SSH_KEY: ${{ secrets.BINGO_DEV_SSH_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          cd "$LOGGING_CANDIDATE"
          python3 deploy/logging-runner.py
