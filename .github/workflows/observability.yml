name: Private observability
on:
  push:
    branches: [codex/ci-001-tiered-gates]
    paths:
      - 'deploy/logging-*'
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xboard-private-observability
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configuration and deployment boundary tests
        run: |
          python3 -m unittest discover -s deploy/observability -p '*test*.py'
          python3 -m unittest discover -s deploy -p 'logging_test.py'
      - name: Real isolated log ingestion and recovery
        run: python3 deploy/observability/smoke.py
      - name: Verify collector artifact packaging
        run: |
          mkdir collector-artifact
          docker tag xboard-log-collector:local "xboard-log-collector:$GITHUB_SHA"
          docker save "xboard-log-collector:$GITHUB_SHA" | gzip > collector-artifact/collector.tar.gz
          python3 deploy/package-log-collector.py collector-artifact "$GITHUB_SHA"
