name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.detect.outputs.all }}
      backend: ${{ steps.detect.outputs.backend }}
      backend_all: ${{ steps.detect.outputs.backend_all }}
      backend_store: ${{ steps.detect.outputs.backend_store }}
      backend_xboard: ${{ steps.detect.outputs.backend_xboard }}
      backend_services_a: ${{ steps.detect.outputs.backend_services_a }}
      backend_services_b: ${{ steps.detect.outputs.backend_services_b }}
      backend_remainder: ${{ steps.detect.outputs.backend_remainder }}
      migration_drill: ${{ steps.detect.outputs.migration_drill }}
      real_client_compat: ${{ steps.detect.outputs.real_client_compat }}
      frontend: ${{ steps.detect.outputs.frontend }}
      browser: ${{ steps.detect.outputs.browser }}
      packaged_browser: ${{ steps.detect.outputs.packaged_browser }}
      split_runtime: ${{ steps.detect.outputs.split_runtime }}
      supply_chain: ${{ steps.detect.outputs.supply_chain }}
      run_go: ${{ steps.detect.outputs.run_go }}
      run_web: ${{ steps.detect.outputs.run_web }}
      run_browser_smoke: ${{ steps.detect.outputs.run_browser_smoke }}
      run_full_regression: ${{ steps.detect.outputs.run_full_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Detect changed files and compute execution scope
        id: detect
        run: node .github/scripts/detect-changes.mjs

  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate project governance baseline
        run: go run ./cmd/projectctl check
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          milestone="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.milestone.title // ""')"
          go run ./cmd/projectctl pr-check --event "$GITHUB_EVENT_PATH" --milestone "$milestone"

  supply-chain:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
    steps:
      - name: Skip supply-chain audit
        if: needs.detect-changes.outputs.supply_chain != 'true'
        run: echo "Skipping supply-chain audit (no dependency changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.supply_chain == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.detect-changes.outputs.supply_chain == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.supply_chain == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.detect-changes.outputs.supply_chain == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked web dependencies
        if: needs.detect-changes.outputs.supply_chain == 'true'
        run: pnpm --dir web install --frozen-lockfile
      - name: Check Go dependency licenses
        if: needs.detect-changes.outputs.supply_chain == 'true'
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check
          --include_tests --ignore github.com/Hao-Monster/Xboard-Go ./...
      - name: Record Go dependency licenses
        if: needs.detect-changes.outputs.supply_chain == 'true'
        run: |
          mkdir -p artifacts
          go run github.com/google/go-licenses/v2@v2.0.1 report \
            --include_tests --ignore github.com/Hao-Monster/Xboard-Go ./... \
            > artifacts/go-licenses.csv
      - name: Check web production dependency licenses
        if: needs.detect-changes.outputs.supply_chain == 'true'
        run: |
          pnpm --dir web licenses list --prod --json > artifacts/web-production-licenses.json
          node .github/scripts/check-production-licenses.mjs artifacts/web-production-licenses.json
          node --test .github/scripts/check-production-licenses.test.mjs
          node --test .github/scripts/authorize-legacy-parity.test.mjs
          node --test .github/scripts/detect-changes.test.mjs
      - name: Generate source SBOM
        if: needs.detect-changes.outputs.supply_chain == 'true'
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft_archive="$RUNNER_TEMP/syft_1.51.1_linux_amd64.tar.gz"
          syft_root="$RUNNER_TEMP/xboard-go-syft-1.51.1"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            --output "$syft_archive" \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3' \
            "$syft_archive" | sha256sum --check --strict
          mkdir -p "$syft_root"
          tar -xzf "$syft_archive" -C "$syft_root" syft
          "$syft_root/syft" scan dir:. \
            --output spdx-json=artifacts/xboard-go-source.spdx.json
      - name: Review changed dependencies
        if: needs.detect-changes.outputs.supply_chain == 'true' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Python-2.0, Unicode-3.0, Zlib, 0BSD, CC0-1.0, Unlicense, LicenseRef-scancode-google-patent-license-golang
      - name: Upload supply-chain evidence
        if: needs.detect-changes.outputs.supply_chain == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  go-race:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        group: [store, xboard, services-a, services-b, remainder]
    env:
      XBOARD_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:8.4.2-alpine@sha256:e1b6db24cb4fdd89f4bc9be09f671ea3bec92fbd7042554f76c34aa2be9b59ad
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Determine if this package group should run
        id: check
        run: |
          GROUP="${{ matrix.group }}"
          SHOULD_RUN="false"
          if [ "${{ needs.detect-changes.outputs.backend }}" != "true" ]; then
            SHOULD_RUN="false"
          elif [ "${{ needs.detect-changes.outputs.backend_all }}" = "true" ]; then
            SHOULD_RUN="true"
          elif [ "$GROUP" = "store" ] && [ "${{ needs.detect-changes.outputs.backend_store }}" = "true" ]; then
            SHOULD_RUN="true"
          elif [ "$GROUP" = "xboard" ] && [ "${{ needs.detect-changes.outputs.backend_xboard }}" = "true" ]; then
            SHOULD_RUN="true"
          elif [ "$GROUP" = "services-a" ] && [ "${{ needs.detect-changes.outputs.backend_services_a }}" = "true" ]; then
            SHOULD_RUN="true"
          elif [ "$GROUP" = "services-b" ] && [ "${{ needs.detect-changes.outputs.backend_services_b }}" = "true" ]; then
            SHOULD_RUN="true"
          elif [ "$GROUP" = "remainder" ] && [ "${{ needs.detect-changes.outputs.backend_remainder }}" = "true" ]; then
            SHOULD_RUN="true"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
      - name: Skip package group check
        if: steps.check.outputs.should_run != 'true'
        run: echo "Skipping go-race (${{ matrix.group }}) (no changes affecting this package group)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.should_run == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.check.outputs.should_run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 24
      - name: Test Go package partitioner
        if: steps.check.outputs.should_run == 'true' && matrix.group == 'store'
        run: node --test .github/scripts/go-test-groups.test.mjs
      - name: Fetch pinned legacy Ip2Region test fixture
        if: steps.check.outputs.should_run == 'true' && matrix.group == 'remainder'
        run: |
          fixture="$RUNNER_TEMP/xboard-go-ip2region-v2.0.8.xdb"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 90 \
            --output "$fixture" \
            https://raw.githubusercontent.com/zoujingli/ip2region/a031c359620c22889fac7b998409fdcdef76a69c/ip2region.xdb
          printf '%s  %s\n' \
            '5555fd1aab63e06096d9ee2a4187e93b8451e650b77ce4138a26eb9cf4d81469' \
            "$fixture" | sha256sum --check --strict
          printf 'XBOARD_TEST_LEGACY_IP2REGION_XDB=%s\n' "$fixture" >> "$GITHUB_ENV"
      - name: Test package group with race detector and coverage
        if: steps.check.outputs.should_run == 'true'
        env:
          GO_TEST_GROUP: ${{ matrix.group }}
        run: |
          mapfile -t packages < <(node .github/scripts/go-test-groups.mjs "$GO_TEST_GROUP")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Go test group is empty: $GO_TEST_GROUP" >&2
            exit 1
          fi
          go test -race -timeout=30m \
            -coverprofile="coverage-${GO_TEST_GROUP}.out" \
            "${packages[@]}"
      - name: Inject Redis failure and verify device-state recovery
        if: steps.check.outputs.should_run == 'true' && matrix.group == 'remainder'
        env:
          XBOARD_TEST_REDIS_FAILURES: "true"
        run: >-
          go test -race -timeout=5m ./internal/devicestate
          -run TestTIMENODE006RedisOutageFailsClosedAndRecoversWithoutInventingEmptyState
          -count=1
      - name: Inject Redis failure and verify HTTP recovery
        if: steps.check.outputs.should_run == 'true' && matrix.group == 'services-a'
        env:
          XBOARD_TEST_REDIS_FAILURES: "true"
        run: >-
          go test -race -timeout=5m ./internal/httpapi
          -run TestINTNODE003RedisCoordinationFailureClosesBeforeWriteAndRecovers
          -count=1
      - name: Upload grouped Go coverage
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-${{ matrix.group }}-${{ github.sha }}
          path: coverage-${{ matrix.group }}.out
          if-no-files-found: warn
          retention-days: 14

  go-static:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Skip go-static
        if: needs.detect-changes.outputs.backend != 'true'
        run: echo "Skipping go-static (no backend changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.backend == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.detect-changes.outputs.backend == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        if: needs.detect-changes.outputs.backend == 'true'
        run: go vet ./...
      - name: Vulnerability scan
        if: needs.detect-changes.outputs.backend == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  migration-drill:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Skip migration-drill
        if: needs.detect-changes.outputs.migration_drill != 'true'
        run: echo "Skipping migration-drill (no database schema or migration changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.migration_drill == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.detect-changes.outputs.migration_drill == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Reconcile and roll back representative legacy migration
        if: needs.detect-changes.outputs.migration_drill == 'true'
        run: >-
          go test -timeout=10m ./internal/testdata/legacy/drill
          -run TestRepresentativeLegacyMigrationDrill -count=1 -v

  real-client-compat:
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 15
    steps:
      - name: Skip real-client-compat
        if: needs.detect-changes.outputs.real_client_compat != 'true'
        run: echo "Skipping real-client-compat (no client or HTTP API changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.real_client_compat == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.detect-changes.outputs.real_client_compat == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate generated subscriptions with pinned real clients
        if: needs.detect-changes.outputs.real_client_compat == 'true'
        run: .github/scripts/check-real-client-compat.sh artifacts/client-compat
      - name: Upload real-client compatibility evidence
        if: needs.detect-changes.outputs.real_client_compat == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-client-compat-${{ github.sha }}
          path: artifacts/client-compat/
          if-no-files-found: error
          retention-days: 30

  go:
    needs: [detect-changes, go-race, go-static, migration-drill, real-client-compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go verification job
        env:
          BACKEND_NEEDED: ${{ needs.detect-changes.outputs.backend }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
          MIGRATION_DRILL_RESULT: ${{ needs.migration-drill.result }}
          REAL_CLIENT_COMPAT_RESULT: ${{ needs.real-client-compat.result }}
        run: |
          if [ "$BACKEND_NEEDED" != "true" ]; then
            echo "Skipping Go verification gate: no backend changes in this run."
            exit 0
          fi
          if [ "$GO_RACE_RESULT" != "success" ] || [ "$GO_STATIC_RESULT" != "success" ] || [ "$MIGRATION_DRILL_RESULT" != "success" ] || [ "$REAL_CLIENT_COMPAT_RESULT" != "success" ]; then
            echo "Go verification failed: race=$GO_RACE_RESULT static=$GO_STATIC_RESULT migration_drill=$MIGRATION_DRILL_RESULT real_client_compat=$REAL_CLIENT_COMPAT_RESULT" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Skip web verification
        if: needs.detect-changes.outputs.run_web != 'true'
        run: echo "Skipping web verification (no frontend changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.run_web == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.run_web == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.detect-changes.outputs.run_web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: web
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm typecheck
        working-directory: web
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm lint
        working-directory: web
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm test:coverage
        working-directory: web
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm build
        working-directory: web
      - if: needs.detect-changes.outputs.run_web == 'true'
        run: pnpm audit --audit-level high
        working-directory: web

  browser:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Skip browser verification
        if: needs.detect-changes.outputs.run_browser_smoke != 'true'
        run: echo "Skipping browser E2E verification (no browser smoke or full regression trigger)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.run_browser_smoke == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: web
      - if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        run: pnpm build
        working-directory: web
      - if: needs.detect-changes.outputs.run_browser_smoke == 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Run full browser regression
        if: needs.detect-changes.outputs.run_full_regression == 'true'
        run: pnpm test:e2e
        working-directory: web
      - name: Run browser smoke suite
        if: needs.detect-changes.outputs.run_browser_smoke == 'true' && needs.detect-changes.outputs.run_full_regression != 'true'
        run: pnpm exec playwright test e2e/admin-navigation.spec.ts e2e/registration.spec.ts --project chromium --project mobile-chromium
        working-directory: web

  packaged-browser:
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      XBOARD_GO_REVISION: ${{ github.sha }}
      # Keep the packaged test install on a valid configurable secure path;
      # browser helpers target the same persisted path.
      XBOARD_E2E_ADMIN_PATH: e2e-admin-secure
      XBOARD_LEGACY_ADMIN_PATH: e2e-admin-secure
      XBOARD_CAPTCHA_ALLOW_INSECURE: "true"
      XBOARD_CAPTCHA_RECAPTCHA_VERIFY_URL: http://captcha-stub:4199/recaptcha
      XBOARD_CAPTCHA_RECAPTCHA_V3_VERIFY_URL: http://captcha-stub:4199/recaptcha-v3
      XBOARD_CAPTCHA_TURNSTILE_VERIFY_URL: http://captcha-stub:4199/turnstile
    steps:
      - name: Skip packaged browser verification
        if: needs.detect-changes.outputs.packaged_browser != 'true'
        run: echo "Skipping packaged-browser (no packaging or full-stack deployment changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.packaged_browser == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: pnpm --dir web install --frozen-lockfile
      - if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Start packaged application
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: |
          mkdir -p .local
          password="$(openssl rand -hex 24)"
          settings_key="$(openssl rand -base64 32 | tr -d '\n')"
          printf '%s' "$password" > .local/bootstrap-password.txt
          printf '%s' "$settings_key" > .local/settings-encryption-key.txt
          printf 'XBOARD_PACKAGED_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker compose -f compose.local.yaml --profile e2e up --build --wait
      - name: Verify packaged maintenance temporary workspace
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: |
          set +e
          output="$(docker run --rm --entrypoint /xboard xboard-go:local backup verify --input /missing 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q '^open backup archive:' <<<"$output"; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Run isolated registration-trial desktop browser test
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web exec playwright test e2e/registration-trial.spec.ts --project chromium
      - name: Reset in-memory request limiters before the desktop regression suite
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run desktop browser regression suite against the packaged application
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: >-
          pnpm --dir web exec playwright test --project chromium
          --grep-invert "administrator configures a registration trial and a public registration receives its full entitlement"
      - name: Reset in-memory request limiters before the mobile project
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run isolated registration-trial mobile browser test
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web exec playwright test e2e/registration-trial.spec.ts --project mobile-chromium
      - name: Reset in-memory request limiters before the mobile regression suite
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run mobile browser regression suite against the packaged application
        if: needs.detect-changes.outputs.packaged_browser == 'true'
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: >-
          pnpm --dir web exec playwright test --project mobile-chromium
          --grep-invert "administrator configures a registration trial and a public registration receives its full entitlement"
      - name: Capture container logs on failure
        if: failure() && needs.detect-changes.outputs.packaged_browser == 'true'
        run: docker compose -f compose.local.yaml --profile e2e logs --no-color
      - name: Stop packaged application
        if: always() && needs.detect-changes.outputs.packaged_browser == 'true'
        run: docker compose -f compose.local.yaml --profile e2e down --volumes

  split-runtime:
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      XBOARD_GO_REVISION: ${{ github.sha }}
      XBOARD_E2E_ADMIN_PATH: e2e-admin-secure
      XBOARD_LEGACY_ADMIN_PATH: e2e-admin-secure
      XBOARD_CAPTCHA_ALLOW_INSECURE: "true"
      XBOARD_CAPTCHA_RECAPTCHA_VERIFY_URL: http://captcha-stub:4199/recaptcha
      XBOARD_CAPTCHA_RECAPTCHA_V3_VERIFY_URL: http://captcha-stub:4199/recaptcha-v3
      XBOARD_CAPTCHA_TURNSTILE_VERIFY_URL: http://captcha-stub:4199/turnstile
      XBOARD_WEBSOCKET_ENABLED: "true"
    steps:
      - name: Skip split runtime verification
        if: needs.detect-changes.outputs.split_runtime != 'true'
        run: echo "Skipping split-runtime (no split architecture or deployment changes)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.detect-changes.outputs.split_runtime == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.split_runtime == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.detect-changes.outputs.split_runtime == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: needs.detect-changes.outputs.split_runtime == 'true'
        run: pnpm --dir web install --frozen-lockfile
      - if: needs.detect-changes.outputs.split_runtime == 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Validate split deployment invariants
        if: needs.detect-changes.outputs.split_runtime == 'true'
        run: |
          node --test .github/scripts/check-split-topology.test.mjs
          docker compose -f compose.split.yaml config --format json |
            node .github/scripts/check-split-topology.mjs
      - name: Build exact split images
        if: needs.detect-changes.outputs.split_runtime == 'true'
        run: |
          mkdir -p .local
          chmod 0700 .local
          password="$(openssl rand -hex 24)"
          settings_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$password"
          printf '%s' "$password" > .local/bootstrap-password.txt
          printf '%s' "$settings_key" > .local/settings-encryption-key.txt
          chmod 0444 .local/bootstrap-password.txt .local/settings-encryption-key.txt
          printf 'XBOARD_SPLIT_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker compose -f compose.split.yaml build gateway frontend backend
          for image in xboard-go-gateway:local xboard-go-frontend:local xboard-go-backend:local; do
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          done
      - name: Start split application and verify routing boundaries
        if: needs.detect-changes.outputs.split_runtime == 'true'
        run: |
          docker compose -f compose.split.yaml --profile e2e up -d --no-build --wait
          test "$(curl --fail --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7080/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7080/wrong-admin-path)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7080/frontend-healthz)" = 404
          test "$(curl --fail --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7080/gateway-healthz)" = 200
          asset="$(curl --fail --silent http://127.0.0.1:7080/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -n1)"
          test -n "$asset"
          curl --fail --silent --head "http://127.0.0.1:7080$asset" |
            grep -qi '^cache-control: public, max-age=31536000, immutable'
          for service in gateway frontend backend; do
            docker compose -f compose.split.yaml ps -q "$service" |
              xargs docker inspect |
              jq -e '.[0].HostConfig.ReadonlyRootfs == true and
                (.[0].HostConfig.CapDrop | index("ALL") != null) and
                (.[0].HostConfig.SecurityOpt | index("no-new-privileges:true") != null)' >/dev/null
          done
          for service in frontend backend; do
            docker compose -f compose.split.yaml ps -q "$service" |
              xargs docker inspect |
              jq -e '((.[0].HostConfig.PortBindings // {}) | length) == 0' >/dev/null
          done
      - name: Verify independent frontend and backend replacement
        if: needs.detect-changes.outputs.split_runtime == 'true'
        run: |
          set -euo pipefail
          wait_url() {
            for _ in $(seq 1 20); do
              if curl --fail --silent --show-error "$1" >/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }
          gateway_id="$(docker compose -f compose.split.yaml ps -q gateway)"
          backend_id="$(docker compose -f compose.split.yaml ps -q backend)"
          frontend_id="$(docker compose -f compose.split.yaml ps -q frontend)"
          asset="$(curl --fail --silent http://127.0.0.1:7080/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -n1)"

          docker compose -f compose.split.yaml up -d --no-deps --no-build --force-recreate --wait frontend
          test "$(docker compose -f compose.split.yaml ps -q gateway)" = "$gateway_id"
          test "$(docker compose -f compose.split.yaml ps -q backend)" = "$backend_id"
          test "$(docker compose -f compose.split.yaml ps -q frontend)" != "$frontend_id"
          wait_url http://127.0.0.1:7080/xboard-logo.svg
          wait_url "http://127.0.0.1:7080$asset"

          frontend_id="$(docker compose -f compose.split.yaml ps -q frontend)"
          docker compose -f compose.split.yaml up -d --no-deps --no-build --force-recreate --wait backend
          test "$(docker compose -f compose.split.yaml ps -q gateway)" = "$gateway_id"
          test "$(docker compose -f compose.split.yaml ps -q frontend)" = "$frontend_id"
          test "$(docker compose -f compose.split.yaml ps -q backend)" != "$backend_id"
          wait_url http://127.0.0.1:7080/healthz
          wait_url http://127.0.0.1:7080/e2e-admin-secure
      - name: Run critical desktop and mobile split-runtime browser regression
        if: needs.detect-changes.outputs.split_runtime == 'true'
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_SPLIT_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: >-
          pnpm --dir web exec playwright test
          e2e/admin-secure-path.spec.ts e2e/server-schedule.spec.ts
          --project chromium --project mobile-chromium
      - name: Capture split container logs on failure
        if: failure() && needs.detect-changes.outputs.split_runtime == 'true'
        run: docker compose -f compose.split.yaml --profile e2e logs --no-color
      - name: Stop split application
        if: always() && needs.detect-changes.outputs.split_runtime == 'true'
        run: |
          docker compose -f compose.split.yaml --profile e2e down --volumes
          chmod 0600 .local/bootstrap-password.txt .local/settings-encryption-key.txt 2>/dev/null || true
