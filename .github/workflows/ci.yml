name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate project governance baseline
        run: go run ./cmd/projectctl check
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          milestone="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.milestone.title // ""')"
          go run ./cmd/projectctl pr-check --event "$GITHUB_EVENT_PATH" --milestone "$milestone"

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check Go dependency licenses
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check
          --include_tests --ignore github.com/Hao-Monster/Xboard-Go ./...
      - name: Record Go dependency licenses
        run: |
          mkdir -p artifacts
          go run github.com/google/go-licenses/v2@v2.0.1 report \
            --include_tests --ignore github.com/Hao-Monster/Xboard-Go ./... \
            > artifacts/go-licenses.csv
      - name: Check web production dependency licenses
        run: |
          pnpm --dir web licenses list --prod --json > artifacts/web-production-licenses.json
          node .github/scripts/check-production-licenses.mjs artifacts/web-production-licenses.json
          node --test .github/scripts/check-production-licenses.test.mjs
          node --test .github/scripts/authorize-legacy-parity.test.mjs
      - name: Generate source SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft_archive="$RUNNER_TEMP/syft_1.51.1_linux_amd64.tar.gz"
          syft_root="$RUNNER_TEMP/xboard-go-syft-1.51.1"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            --output "$syft_archive" \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3' \
            "$syft_archive" | sha256sum --check --strict
          mkdir -p "$syft_root"
          tar -xzf "$syft_archive" -C "$syft_root" syft
          "$syft_root/syft" scan dir:. \
            --output spdx-json=artifacts/xboard-go-source.spdx.json
      - name: Review changed dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Python-2.0, Unicode-3.0, Zlib, 0BSD, CC0-1.0, Unlicense
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  go-race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [store, xboard, services-a, services-b, remainder]
    env:
      XBOARD_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:8.4.2-alpine@sha256:e1b6db24cb4fdd89f4bc9be09f671ea3bec92fbd7042554f76c34aa2be9b59ad
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test Go package partitioner
        if: matrix.group == 'store'
        run: node --test .github/scripts/go-test-groups.test.mjs
      - name: Fetch pinned legacy Ip2Region test fixture
        if: matrix.group == 'remainder'
        run: |
          fixture="$RUNNER_TEMP/xboard-go-ip2region-v2.0.8.xdb"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 90 \
            --output "$fixture" \
            https://raw.githubusercontent.com/zoujingli/ip2region/a031c359620c22889fac7b998409fdcdef76a69c/ip2region.xdb
          printf '%s  %s\n' \
            '5555fd1aab63e06096d9ee2a4187e93b8451e650b77ce4138a26eb9cf4d81469' \
            "$fixture" | sha256sum --check --strict
          printf 'XBOARD_TEST_LEGACY_IP2REGION_XDB=%s\n' "$fixture" >> "$GITHUB_ENV"
      - name: Test package group with race detector and coverage
        env:
          GO_TEST_GROUP: ${{ matrix.group }}
        run: |
          mapfile -t packages < <(node .github/scripts/go-test-groups.mjs "$GO_TEST_GROUP")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Go test group is empty: $GO_TEST_GROUP" >&2
            exit 1
          fi
          go test -race -timeout=30m \
            -coverprofile="coverage-${GO_TEST_GROUP}.out" \
            "${packages[@]}"
      - name: Inject Redis failure and verify device-state recovery
        if: matrix.group == 'remainder'
        env:
          XBOARD_TEST_REDIS_FAILURES: "true"
        run: >-
          go test -race -timeout=5m ./internal/devicestate
          -run TestTIMENODE006RedisOutageFailsClosedAndRecoversWithoutInventingEmptyState
          -count=1
      - name: Inject Redis failure and verify HTTP recovery
        if: matrix.group == 'services-a'
        env:
          XBOARD_TEST_REDIS_FAILURES: "true"
        run: >-
          go test -race -timeout=5m ./internal/httpapi
          -run TestINTNODE003RedisCoordinationFailureClosesBeforeWriteAndRecovers
          -count=1
      - name: Upload grouped Go coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-coverage-${{ matrix.group }}-${{ github.sha }}
          path: coverage-${{ matrix.group }}.out
          if-no-files-found: warn
          retention-days: 14

  go-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  go:
    needs: [go-race, go-static]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go verification job
        env:
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
        run: |
          if [ "$GO_RACE_RESULT" != "success" ] || [ "$GO_STATIC_RESULT" != "success" ]; then
            echo "Go verification failed: race=$GO_RACE_RESULT static=$GO_STATIC_RESULT" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --audit-level high

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  packaged-browser:
    runs-on: ubuntu-latest
    env:
      XBOARD_GO_REVISION: ${{ github.sha }}
      # Keep the packaged test install on a valid configurable secure path;
      # browser helpers target the same persisted path.
      XBOARD_E2E_ADMIN_PATH: e2e-admin-secure
      XBOARD_LEGACY_ADMIN_PATH: e2e-admin-secure
      XBOARD_CAPTCHA_ALLOW_INSECURE: "true"
      XBOARD_CAPTCHA_RECAPTCHA_VERIFY_URL: http://captcha-stub:4199/recaptcha
      XBOARD_CAPTCHA_RECAPTCHA_V3_VERIFY_URL: http://captcha-stub:4199/recaptcha-v3
      XBOARD_CAPTCHA_TURNSTILE_VERIFY_URL: http://captcha-stub:4199/turnstile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Start packaged application
        run: |
          mkdir -p .local
          password="$(openssl rand -hex 24)"
          settings_key="$(openssl rand -base64 32 | tr -d '\n')"
          printf '%s' "$password" > .local/bootstrap-password.txt
          printf '%s' "$settings_key" > .local/settings-encryption-key.txt
          printf 'XBOARD_PACKAGED_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker compose -f compose.local.yaml --profile e2e up --build --wait
      - name: Verify packaged maintenance temporary workspace
        run: |
          set +e
          output="$(docker run --rm --entrypoint /xboard xboard-go:local backup verify --input /missing 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q '^open backup archive:' <<<"$output"; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Run isolated registration-trial desktop browser test
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web exec playwright test e2e/registration-trial.spec.ts --project chromium
      - name: Reset in-memory request limiters before the desktop regression suite
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run desktop browser regression suite against the packaged application
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: >-
          pnpm --dir web exec playwright test --project chromium
          --grep-invert "administrator configures a registration trial and a public registration receives its full entitlement"
      - name: Reset in-memory request limiters before the mobile project
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run isolated registration-trial mobile browser test
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web exec playwright test e2e/registration-trial.spec.ts --project mobile-chromium
      - name: Reset in-memory request limiters before the mobile regression suite
        run: |
          docker compose -f compose.local.yaml --profile e2e restart xboard-go
          docker compose -f compose.local.yaml --profile e2e up -d --no-build --wait xboard-go
      - name: Run mobile browser regression suite against the packaged application
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: >-
          pnpm --dir web exec playwright test --project mobile-chromium
          --grep-invert "administrator configures a registration trial and a public registration receives its full entitlement"
      - name: Capture container logs on failure
        if: failure()
        run: docker compose -f compose.local.yaml --profile e2e logs --no-color
      - name: Stop packaged application
        if: always()
        run: docker compose -f compose.local.yaml --profile e2e down --volumes
