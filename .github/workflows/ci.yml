name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --audit-level high

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  packaged-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Start packaged application
        env:
          XBOARD_GO_REVISION: ${{ github.sha }}
        run: |
          mkdir -p .local
          password="$(openssl rand -hex 24)"
          settings_key="$(openssl rand -base64 32 | tr -d '\n')"
          printf '%s' "$password" > .local/bootstrap-password.txt
          printf '%s' "$settings_key" > .local/settings-encryption-key.txt
          printf 'XBOARD_PACKAGED_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker compose -f compose.local.yaml up --build --wait
      - name: Run desktop browser tests against the packaged application
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web test:e2e:desktop
      - name: Reset in-memory request limiters before the mobile project
        run: |
          docker compose -f compose.local.yaml restart xboard-go
          docker compose -f compose.local.yaml up -d --no-build --wait xboard-go
      - name: Run mobile browser tests against the packaged application
        env:
          XBOARD_E2E_BASE_URL: http://127.0.0.1:7080
          XBOARD_E2E_EXTERNAL_SERVER: "true"
          XBOARD_E2E_ADMIN_EMAIL: admin@xboard-go.local
          XBOARD_E2E_ADMIN_PASSWORD: ${{ env.XBOARD_PACKAGED_PASSWORD }}
          XBOARD_E2E_MAILPIT_URL: http://127.0.0.1:7082
        run: pnpm --dir web test:e2e:mobile
      - name: Capture container logs on failure
        if: failure()
        run: docker compose -f compose.local.yaml logs --no-color
      - name: Stop packaged application
        if: always()
        run: docker compose -f compose.local.yaml down --volumes
