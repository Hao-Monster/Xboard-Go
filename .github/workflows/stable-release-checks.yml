name: Stable publisher checks
on:
  pull_request:
    paths:
      - '.github/workflows/stable-release*.yml'
      - 'deploy/stable-release.py'
      - 'deploy/stable_release_test.py'
      - 'deploy/self-hosted/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy -p stable_release_test.py -v
      - run: python3 -m unittest discover -s deploy/self-hosted -p 'test_*.py' -v
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/stable-release.yml .github/workflows/stable-release-checks.yml deploy/self-hosted/.github/workflows/deploy.yml
  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build isolated application image
        env:
          REVISION: ${{ github.sha }}
        run: docker build --build-arg APP_REVISION="$REVISION" --tag xboard-go:self-host-smoke .
      - name: Verify install, no-op, upgrade and failed deployment freeze
        run: sudo python3 deploy/self-hosted/smoke.py xboard-go:self-host-smoke
