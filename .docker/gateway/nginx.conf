worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    # Preserve the backend's 1 GiB attachment contract without allowing an
    # unbounded request stream to consume a gateway connection indefinitely.
    client_max_body_size 1100m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache_path /tmp/static_cache levels=1:2 keys_zone=static_cache:8m max_size=96m inactive=24h use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream xboard_backend {
        zone xboard_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server backend:8080 resolve;
        keepalive 64;
    }

    upstream xboard_frontend {
        zone xboard_frontend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server frontend:8080 resolve;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location = /gateway-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /assets/ {
            proxy_pass http://xboard_frontend;
            proxy_http_version 1.1;
            proxy_cache static_cache;
            proxy_cache_key $uri;
            proxy_cache_lock on;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
        }

        location = /xboard-logo.svg {
            proxy_pass http://xboard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
        }

        location = /public-knowledge.css {
            proxy_pass http://xboard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
        }

        location = /ws {
            proxy_pass http://xboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://xboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }
    }
}
